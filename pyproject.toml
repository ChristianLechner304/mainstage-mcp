[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mainstage-mcp"
version = "0.1.0"
description = "MCP server that lets AI assistants build Apple MainStage concerts: song patches, sounds, tempo, mixer and Playback tracks."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["mcp>=1.2,<3"]
keywords = ["mcp", "mainstage", "apple", "music", "keyboard", "live"]
classifiers = [
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
mainstage-mcp = "mainstage_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mainstage_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
